name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'

    - name: Download dependencies
      run: go mod download

    - name: Run all tests (Unit, Integration, and E2E)
      # We run everything with sudo so the eBPF/fanotify tests execute fully
      run: sudo go test -v ./...

  bpf-freshness:
    name: BPF Objects Up To Date
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'

    - name: Install clang and libbpf headers
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang llvm libbpf-dev

    - name: Regenerate BPF objects
      run: make generate

    - name: Fail if regeneration changed committed files
      # The .bpf.c programs (proc.bpf.c, net.bpf.c, tls.bpf.c) are compiled
      # locally and their .o/.go bindings are committed (CI has no clang in
      # the test job, so it can't build them at test time). Only the
      # generated .go files are compared: the .o bytes depend on the clang
      # version, while the .go files hold the map, program and type
      # definitions, which do not. If this step fails, someone edited a
      # .bpf.c file without running `make generate` and committing the
      # result.
      run: |
        dirs="pkg/probe/proc pkg/probe/net"
        if [ -n "$(git status --porcelain -- $dirs | grep -v '\.o$')" ]; then
          echo "::error::Committed BPF bindings are stale. Run 'make generate' and commit the result."
          git diff -- $dirs ':(exclude)*.o'
          git status --porcelain -- $dirs
          exit 1
        fi
